name: Indodax Scan (24/7)

on:
  schedule:
    # tiap 15 menit, sepanjang hari - kripto trading 24/7 jadi gak ada jam tutup kayak IDX
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: indodax-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # deps buat scan_once.py doang - dipisah dari requirements.txt (itu buat
      # setup lokal future_market.py, ikut flask/telebot yang gak kepake di sini).
      - name: Install dependencies
        run: pip install ccxt pandas requests python-dotenv

      # last_alerts.json sengaja gak masuk git - dipertahankan lewat cache biar
      # gak kirim alert dobel buat sinyal yang sama tiap run (pola sama kayak
      # signal.log di idx-algo-signal-surya).
      - name: Restore last_alerts.json dari cache run sebelumnya
        uses: actions/cache@v4
        with:
          path: last_alerts.json
          key: high-tf-alerts-${{ github.run_id }}
          restore-keys: |
            high-tf-alerts-

      - name: Scan market & kirim alert
        env:
          TOKEN_HIGH: ${{ secrets.TOKEN_HIGH }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python scan_once.py

      # latest_scan.json DI-commit balik ke repo (bukan cuma cache) - dashboard
      # live di Vercel baca file ini langsung dari GitHub raw content, jadi
      # perlu nempel di riwayat repo, bukan cuma bertahan antar-run Actions.
      - name: Commit latest_scan.json buat dashboard live
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_scan.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: update latest scan snapshot [skip ci]"
          git push
