name: Price Monitor (TP/SL auto-close)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: high-tf-price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ccxt requests

      - name: Monitor posisi & auto-close TP/SL
        env:
          BOT_SECRET: ${{ secrets.BOT_SECRET }}
        run: python price_monitor_once.py
